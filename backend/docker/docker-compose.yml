services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"  # Bind to all interfaces so phones on the same LAN can reach it
    env_file:
      - ../.env
    environment:
      # Server-side object operations stay on Docker's private network.
      AWS_S3_ENDPOINT_URL: http://minio:9000
      # AWS_S3_PUBLIC_ENDPOINT_URL is intentionally NOT set here so the value
      # from ../.env wins (the Cloudflare tunnel storage hostname, e.g.
      # https://storage.carebridge-lab.com). A compose `environment:` entry
      # would override env_file and make presigned URLs point at 127.0.0.1,
      # which real devices reaching the backend via the tunnel cannot fetch.
    depends_on:
      - db
      - redis
      - minio
    volumes:
      - ..:/app
      - ${CAREBRIDGE_SECRETS_DIR:-./secrets}:/secrets:ro
    command: >
      gunicorn carebridge_api.asgi:application
      -k uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:8000
      --workers 4

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${DB_NAME:-carebridge}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

  minio:
    image: minio/minio:latest
    ports:
      # Bind S3 locally by default. Device-specific IPs belong in ignored override files.
      - "${CAREBRIDGE_STORAGE_BIND_IP:-127.0.0.1}:9000:9000"
      - "127.0.0.1:9001:9001"   # Web console
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: create bucket + open anonymous download so development is friction-free.
  # `createbuckets` exits after setup; re-running docker compose up is idempotent.
  createbuckets:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set local http://minio:9000 ${AWS_ACCESS_KEY_ID:-minioadmin} ${AWS_SECRET_ACCESS_KEY:-minioadmin}) do echo 'waiting for minio'; sleep 2; done;
      /usr/bin/mc mb --ignore-existing local/${AWS_STORAGE_BUCKET_NAME:-carebridge-storage};
      exit 0;
      "

  celery-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ../.env
    environment:
      AWS_S3_ENDPOINT_URL: http://minio:9000
      # AWS_S3_PUBLIC_ENDPOINT_URL comes from ../.env (Cloudflare tunnel storage
      # hostname) so presigned URLs are reachable from real devices.
    depends_on:
      - db
      - redis
    command: celery -A carebridge_api worker -l info
    volumes:
      - ..:/app
      - ${CAREBRIDGE_SECRETS_DIR:-./secrets}:/secrets:ro

  celery-beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ../.env
    environment:
      AWS_S3_ENDPOINT_URL: http://minio:9000
      # AWS_S3_PUBLIC_ENDPOINT_URL comes from ../.env (Cloudflare tunnel storage
      # hostname) so presigned URLs are reachable from real devices.
    depends_on:
      - db
      - redis
    command: celery -A carebridge_api beat -l info
    volumes:
      - ..:/app
      - ${CAREBRIDGE_SECRETS_DIR:-./secrets}:/secrets:ro

  dashboard:
    build:
      context: ../../dashboard
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - web

volumes:
  pgdata:
  miniodata:
